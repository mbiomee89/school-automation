# Render Blueprint — one web service (API + built React app) + free Postgres.
# Dashboard: https://dashboard.render.com → New → Blueprint
#
# Free limits (testing):
# - Web service sleeps after ~15 min idle (first request ~30–60s)
# - Free Postgres expires after 30 days
# - Uploaded files are ephemeral (lost on redeploy)

databases:
  - name: school-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: school-automation
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: chmod +x scripts/render-build.sh && ./scripts/render-build.sh
    startCommand: node backend/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PARENT_JWT_EXPIRES_IN
        value: 2h
      - key: UPLOAD_DIR
        value: ./backend/uploads
