# Render Blueprint — Node web service + optional free Postgres.
# Live DB is often Neon (set DATABASE_URL in the dashboard).
#
# Native Node images include python3-pip — build installs pymupdf for aSc PDF import.
# Prefer External / Neon DATABASE_URL if Render internal Postgres host fails (P1001).

databases:
  - name: school-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: school-automation
    runtime: node
    plan: free
    region: oregon
    buildCommand: pip3 install --user --no-cache-dir pymupdf && sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma && npm install --include=dev && npx prisma generate --schema=prisma/schema.prisma && npm run build -w frontend
    startCommand: node scripts/start.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PARENT_JWT_EXPIRES_IN
        value: 2h
      - key: UPLOAD_DIR
        value: ./backend/uploads
      - key: PYTHON
        value: python3
      - key: NODE_VERSION
        value: "22.16.0"
