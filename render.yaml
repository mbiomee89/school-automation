# Render Blueprint — one web service (API + built React app) + free Postgres.
# Dashboard: https://dashboard.render.com → New → Blueprint
#
# Free limits (testing):
# - Web service sleeps after ~15 min idle (first request ~30–60s)
# - Free Postgres expires after 30 days
# - Uploaded files are ephemeral (lost on redeploy) — re-upload logo;
#   keep ZIP backups locally. See docs/ops-hosting.md.
#
# Start (scripts/start.js): prisma db push WITHOUT --accept-data-loss;
# migrate deploy baseline deferred (sqlite local vs postgres on Render).
#
# IMPORTANT: web service + Postgres must be in the SAME region or the
# internal DATABASE_URL host (dpg-…-a) is unreachable (Prisma P1001).
# Prefer External DATABASE_URL if internal host fails (P1001).

databases:
  - name: school-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: school-automation
    runtime: node
    plan: free
    region: oregon
    # Prefer inline steps so a broken/missing bash script cannot fail the build.
    # Keep scripts/render-build.sh in sync for local `npm run render:build`.
    buildCommand: sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma && npm install --include=dev && npx prisma generate --schema=prisma/schema.prisma && npm run build -w frontend
    startCommand: node scripts/start.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste External Database URL in the Render dashboard if Blueprint sync
      # leaves an unreachable internal host (common when regions differ).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PARENT_JWT_EXPIRES_IN
        value: 2h
      - key: UPLOAD_DIR
        value: ./backend/uploads
      - key: NODE_VERSION
        value: "22.16.0"
