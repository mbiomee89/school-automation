# Render Blueprint — Docker web service (Node + Python/pymupdf) + optional free Postgres.
# Dashboard: https://dashboard.render.com
#
# Live DB may be Neon (set DATABASE_URL in the dashboard). Blueprint Postgres is optional.
#
# IMPORTANT: web service + Postgres must be in the SAME region if using Render DB.
# Prefer External / Neon DATABASE_URL if internal host fails (P1001).

databases:
  - name: school-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: school-automation
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PARENT_JWT_EXPIRES_IN
        value: 2h
      - key: UPLOAD_DIR
        value: ./backend/uploads
      - key: PYTHON
        value: python3
